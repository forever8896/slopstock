[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
gas_reports = ["AgentNFT", "ShareToken", "Fractionalizer", "RevenueVault", "Marketplace"]

[profile.ci]
fuzz = { runs = 10_000 }
verbosity = 4

[profile.coverage]
optimizer = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
zg_galileo = "${ZG_RPC_URL}"
base_sepolia = "${BASE_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

# See more: https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md
